    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme).
      (function () {
        try {
          var saved = localStorage.getItem("o-eo-theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>

  <body>
    <!--
      CSS image-sharpening filter (feConvolveMatrix). Applied to portfolio
      thumbnails on hover and to the full-screen lightbox image so text and
      UI edges stay crisp without re-exporting the source files.
    -->
    <svg class="pointer-events-none absolute h-0 w-0" aria-hidden="true" focusable="false">
      <defs>
        <filter id="crispen" color-interpolation-filters="sRGB" x="-5%" y="-5%" width="110%" height="110%">
          <feConvolveMatrix
            order="3"
            preserveAlpha="true"
            divisor="1"
            bias="0"
            kernelMatrix="-0.055 -0.055 -0.055  -0.055 1.22 -0.055  -0.055 -0.055 -0.055"
          />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
